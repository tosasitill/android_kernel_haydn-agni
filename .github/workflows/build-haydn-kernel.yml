name: Build AGNi Haydn Kernel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode (hz90 enables 90Hz DTS swap for this repo)
        default: normal
        required: false
        type: choice
        options:
          - normal
          - hz90
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'normal' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'normal' }}
      OUT_DIR: ${{ github.workspace }}/OUTPUT
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-haydn-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-haydn-${{ runner.os }}-${{ github.ref_name }}-
            ccache-haydn-${{ runner.os }}-

      - name: Build Ubuntu Docker image
        run: |
          cat > /tmp/haydn-kernel-build.Dockerfile <<'DOCKER'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC
          RUN apt-get update && apt-get install -y --no-install-recommends \
              bc bison build-essential ca-certificates ccache clang cpio curl flex \
              gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev \
              libncurses-dev libssl-dev libyaml-dev lld llvm make \
              python-is-python3 python3 rsync xz-utils zip \
            && rm -rf /var/lib/apt/lists/*
          RUN useradd -m -u 1001 builder
          USER builder
          WORKDIR /work
          DOCKER
          docker build -t haydn-kernel-build:ubuntu24.04 -f /tmp/haydn-kernel-build.Dockerfile /tmp

      - name: Prepare env
        run: |
          mkdir -p "${OUT_DIR}" "${CCACHE_DIR}"
          if [ -f "${OUT_DIR}/.config" ]; then
            rm -f "${OUT_DIR}/.config"
          fi

      - name: Build kernel in Ubuntu Docker
        run: |
          set -euxo pipefail

          docker run --rm \
            -e MODE="${MODE}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${OUT_DIR}:/out" \
            -v "${CCACHE_DIR}:/ccache" \
            -w /work \
            haydn-kernel-build:ubuntu24.04 \
            bash -lc '
              set -euxo pipefail
              export ARCH=arm64
              export SUBARCH=arm64
              export CCACHE_DIR=/ccache
              export CCACHE_BASEDIR=/work
              export CCACHE_NOHASHDIR=1
              export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

              if [ "${MODE}" = "hz90" ]; then
                if [ ! -f arch/arm64/boot/dts/vendor/qcom/display/lahaina-sde-display.dtsi ]; then
                  echo "Missing 90Hz target DTS file: arch/arm64/boot/dts/vendor/qcom/display/lahaina-sde-display.dtsi"
                  exit 1
                fi
                sed -i "s|/delete-node/ timing@1|/delete-node/ timing@2|" arch/arm64/boot/dts/vendor/qcom/display/lahaina-sde-display.dtsi
              fi

              make_args=(
                O=/out
                LLVM_IAS=1
                DISABLE_WRAPPER=1
                "REAL_CC=ccache clang"
                LD=ld.lld
                LD_COMPAT=ld.lld
                AR=llvm-ar
                NM=llvm-nm
                OBJCOPY=llvm-objcopy
                OBJDUMP=llvm-objdump
                READELF=llvm-readelf
                OBJSIZE=llvm-size
                STRIP=llvm-strip
              )

              make -j"$(nproc)" "${make_args[@]}" agni_haydn_defconfig
              make -j"$(nproc)" "${make_args[@]}" 2>&1 | tee /out/build.log
            '

          if [ ! -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            echo "Image not found, build failed"
            exit 1
          fi

      - name: Collect kernel artifacts
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/$GITHUB_SHA/$MODE"
          cp "${OUT_DIR}/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/artifacts/$GITHUB_SHA/$MODE/Image"

          if [ -f "${OUT_DIR}/arch/arm64/boot/dtb.img" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/dtb.img" "$GITHUB_WORKSPACE/artifacts/$GITHUB_SHA/$MODE/dtb.img"
          fi

          if [ -f "${OUT_DIR}/arch/arm64/boot/dtbo.img" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/dtbo.img" "$GITHUB_WORKSPACE/artifacts/$GITHUB_SHA/$MODE/dtbo.img"
          fi

          cd "$GITHUB_WORKSPACE/artifacts/$GITHUB_SHA/$MODE"
          zip -qr "$GITHUB_WORKSPACE/artifacts/$GITHUB_SHA/$MODE.zip" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AGNi_kernel_haydn_${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'normal' }}_${{ github.sha }}
          path: ${{ github.workspace }}/artifacts/${{ github.sha }}/${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'normal' }}.zip
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AGNi_kernel_haydn_build_log_${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'normal' }}_${{ github.sha }}
          path: ${{ env.OUT_DIR }}/build.log
          if-no-files-found: ignore
          retention-days: 14
