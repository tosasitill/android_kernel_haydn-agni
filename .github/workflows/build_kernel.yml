name: Build AGNi Kernel

on:
  push:
    branches:
      - AGNi_haydn_MIUI_ST
  pull_request:
    branches:
      - AGNi_haydn_MIUI_ST
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build AGNi Kernel for Haydn
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            flex \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libc6-dev-i386 \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            wget \
            curl

      - name: Setup Clang Toolchain
        run: |
          mkdir -p ~/toolchain
          cd ~/toolchain

          # Download Google Clang toolchain from AOSP
          echo "Downloading Google Clang toolchain..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784d.tar.gz -O clang.tar.gz
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

          echo "Clang toolchain setup complete"
          ls -la clang/bin/ | head -20

      - name: Setup Build Configuration
        run: |
          # Create configuration directories
          mkdir -p ~/WORKING_DIRECTORY
          mkdir -p ~/.cache/clang_thinlto-cache

          # Create snapdragon_llvm.sh configuration
          cat > ~/WORKING_DIRECTORY/snapdragon_llvm.sh << 'EOF'
          #!/bin/bash
          export CROSS_COMPILE=$HOME/toolchain/clang/bin/aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=$HOME/toolchain/clang/bin/arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=$HOME/toolchain/clang/bin/arm-linux-gnueabi-
          export CC=$HOME/toolchain/clang/bin/clang
          export LD=$HOME/toolchain/clang/bin/ld.lld
          export AR=$HOME/toolchain/clang/bin/llvm-ar
          export NM=$HOME/toolchain/clang/bin/llvm-nm
          export OBJCOPY=$HOME/toolchain/clang/bin/llvm-objcopy
          export OBJDUMP=$HOME/toolchain/clang/bin/llvm-objdump
          export READELF=$HOME/toolchain/clang/bin/llvm-readelf
          export STRIP=$HOME/toolchain/clang/bin/llvm-strip
          export HOSTCC=$HOME/toolchain/clang/bin/clang
          export HOSTCXX=$HOME/toolchain/clang/bin/clang++
          export HOSTAR=$HOME/toolchain/clang/bin/llvm-ar
          export HOSTLD=$HOME/toolchain/clang/bin/ld.lld
          EOF

          chmod +x ~/WORKING_DIRECTORY/snapdragon_llvm.sh

          echo "Build configuration complete"

      - name: Build Kernel (Standard with KernelSU)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          chmod +x build_kernel_haydn.sh
          ./build_kernel_haydn.sh

      - name: Upload Kernel with KernelSU
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AGNi-Kernel-HyperOS-KSU
          path: READY_ZIP/AGNi_kernel-haydn-*-HyperOS.zip
          if-no-files-found: warn

      - name: Upload Kernel without KernelSU
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AGNi-Kernel-HyperOS-NoKSU
          path: READY_ZIP/AGNi_kernel-haydn-*-HyperOS-NoKSU.zip
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d READY_ZIP ]; then
            echo "### Generated Kernel Files:" >> $GITHUB_STEP_SUMMARY
            ls -lh READY_ZIP/ >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No kernel files generated" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed at: $(date)" >> $GITHUB_STEP_SUMMARY

